[project]
name = "minichatbot"
version = "5.0.0"
description = "Robotics Lab AI Companion Streamlit App"
readme = "README_UV.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.30.0",
    "wikipedia>=1.4.0",
    "pandas>=2.0.0",
    "google-api-python-client>=2.100.0",
    "lxml>=5.0.0",
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    "openai>=1.12.0",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]
